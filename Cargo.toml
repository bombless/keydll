[package]
name = "keydll-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
iced-x86 = "1.21.0"
libloading = "0.8.8"
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
]}

[[bin]]
name = "simple"
path = "src/simple.rs"

[[bin]]
name = "debug"
path = "src/debug.rs"
